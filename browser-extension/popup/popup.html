<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ShadowReply AI</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="container">

    <!-- Header (always visible) -->
    <div class="header">
      <div class="logo">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="12" cy="12" r="10" stroke="#00674f" stroke-width="2"/>
            <circle cx="8" cy="12" r="1.5" fill="#00674f"/>
            <circle cx="12" cy="12" r="1.5" fill="#00674f"/>
            <circle cx="16" cy="12" r="1.5" fill="#00674f"/>
          </svg>
        </div>
        <span class="logo-text">ShadowReply <span class="accent">AI</span></span>
      </div>
      <div id="status-badge" class="status-badge status-free">Gratuit</div>
    </div>

    <!-- VIEW: Form (default) -->
    <div id="view-main" class="view">

      <!-- Selected text indicator -->
      <div id="selection-indicator" class="selection-indicator hidden">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="sel-icon">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14,2 14,8 20,8"/>
        </svg>
        <span class="sel-label">Texte sélectionné ·</span>
        <span id="sel-preview" class="sel-preview"></span>
        <button id="sel-clear" class="sel-clear" title="Effacer">✕</button>
      </div>

      <!-- Generation form -->
      <div class="form-section">
        <label class="form-label" for="message-input">Message reçu</label>
        <textarea
          id="message-input"
          class="form-textarea"
          placeholder="Colle ici le message auquel tu veux répondre…"
          rows="4"
        ></textarea>

        <label class="form-label" for="mode-select">Mode de communication</label>
        <select id="mode-select" class="form-select">
          <option value="dating">💘 Dating</option>
          <option value="business">💼 Professionnel</option>
          <option value="friendly" selected>😊 Amical</option>
          <option value="conflict">⚡ Conflit / Tension</option>
          <option value="cold_polite">🧊 Formel froid</option>
          <option value="follow_up">📬 Relance</option>
          <option value="apology">🙏 Excuse</option>
          <option value="negotiation">🤝 Négociation</option>
        </select>

        <div id="error-banner" class="error-banner hidden"></div>

        <button id="btn-generate" class="btn btn-primary btn-full">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <polygon points="13,2 3,14 12,14 11,22 21,10 12,10"/>
          </svg>
          Générer 3 réponses
        </button>
      </div>

      <!-- Footer -->
      <div class="footer">
        <a id="open-app" href="#" class="open-app-btn">
          Ouvrir ShadowReply AI
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
            <polyline points="15,3 21,3 21,9"/>
            <line x1="10" y1="14" x2="21" y2="3"/>
          </svg>
        </a>
      </div>
    </div>

    <!-- VIEW: Results -->
    <div id="view-results" class="view hidden">

      <div class="results-header">
        <button id="btn-back" class="btn-back">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M19 12H5M12 5l-7 7 7 7"/>
          </svg>
          Retour
        </button>
        <p class="results-title">3 réponses stratégiques</p>
      </div>

      <div id="replies-container" class="replies-container"></div>

      <div class="results-hint hidden" id="no-inject-hint">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        Clique dans un champ texte avant d'utiliser "Insérer"
      </div>

      <!-- Footer -->
      <div class="footer">
        <a id="open-app-results" href="#" class="open-app-btn">
          Voir dans l'application
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
            <polyline points="15,3 21,3 21,9"/>
            <line x1="10" y1="14" x2="21" y2="3"/>
          </svg>
        </a>
      </div>
    </div>

  </div>
  <script src="popup.js"></script>
</body>
</html>
